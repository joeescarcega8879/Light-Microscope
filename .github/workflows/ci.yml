name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System libraries for Qt (offscreen)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      # Tests only need the light dependencies; ultralytics/torch/modal are not imported by them.
      - name: Install test dependencies
        run: pip install PyQt6 opencv-python-headless numpy PyYAML pytest
      - name: Run tests
        run: python -m pytest
